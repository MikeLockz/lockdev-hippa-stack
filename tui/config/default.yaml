# HIPAA Infrastructure Stack TUI Configuration

# TUI Settings
tui:
  # Refresh interval for status updates (seconds)
  refresh_interval: 30
  
  # Maximum lines to keep in output buffer
  max_output_lines: 10000
  
  # Theme settings
  themes:
    default: dark
    options:
      - dark
      - light
      - high_contrast
  
  # Layout settings
  layout:
    command_tree_width: "30%"
    status_bar_height: 1
    footer_height: 1
  
  # Auto-scroll output pane
  auto_scroll: true
  
  # Show line numbers in output
  show_line_numbers: false

# Command Configuration
commands:
  # Favorite commands (shown at top)
  favorites:
    - "help"
    - "install"
    - "dev-app"
    - "test"
    - "deploy-dev"
    - "status"
  
  # Command categories with priority
  categories:
    development:
      priority: high
      expanded: true
      commands:
        - "install"
        - "install-deps"
        - "setup"
        - "verify"
        - "dev-app"
        - "dev-logs"
        - "dev-stop"
        - "dev-status"
    
    infrastructure:
      priority: high
      expanded: true
      commands:
        - "setup-env-dev"
        - "preview-dev"
        - "deploy-dev"
        - "clean-dev"
        - "validate-env-dev"
    
    testing:
      priority: medium
      expanded: false
      commands:
        - "test"
        - "test-app"
        - "test-iac"
        - "lint"
        - "format"
    
    monitoring:
      priority: medium
      expanded: false
      commands:
        - "status"
        - "show-outputs"
        - "list-aws-resources"
        - "generate-diagrams"

# Environment Configuration
environments:
  dev:
    name: "Development"
    color: "#4299e1"
    aws_profile: "pulumi-deploy-user-dev"
    dangerous: false
  
  staging:
    name: "Staging"
    color: "#ed8936"
    aws_profile: "pulumi-deploy-user-staging"
    dangerous: false
  
  prod:
    name: "Production"
    color: "#e53e3e"
    aws_profile: "pulumi-deploy-user-prod"
    dangerous: true

# Status Monitoring
status:
  # Components to monitor
  components:
    repository:
      name: "Repo"
      checks:
        - git_status
        - dependency_check
        - config_validation
    
    aws:
      name: "AWS"
      checks:
        - credential_validation
        - connectivity_check
        - profile_check
    
    pulumi:
      name: "Pulumi"
      checks:
        - login_status
        - stack_status
        - backend_connectivity
    
    docker:
      name: "Docker"
      checks:
        - engine_status
        - container_health
        - image_availability
  
  # Refresh settings
  auto_refresh: true
  refresh_on_command: true
  background_checks: true

# Keyboard Shortcuts
# (See keybindings.yaml for detailed key mappings)

# Security Settings
security:
  # Require confirmation for dangerous commands
  confirm_dangerous: true
  
  # Dangerous command patterns
  dangerous_patterns:
    - "clean-.*-complete$"
    - "emergency-.*"
    - ".*-prod$"
    - "rotate-.*"
    - "force-.*"
  
  # Commands that require production confirmation
  production_commands:
    - "deploy-prod"
    - "clean-prod"
    - "setup-env-prod"

# Logging
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR)
  level: "INFO"
  
  # Log file location
  file: "~/.local/share/hipaa-tui/logs/tui.log"
  
  # Max log file size (MB)
  max_size: 10
  
  # Number of log files to keep
  backup_count: 5

# Features
features:
  # Enable command history
  command_history: true
  
  # Enable search functionality
  search: true
  
  # Enable command bookmarks
  bookmarks: true
  
  # Enable syntax highlighting
  syntax_highlighting: true
  
  # Enable auto-completion
  auto_completion: false  # Phase 2 feature
  
  # Enable command execution
  command_execution: false  # Phase 2 feature